version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: shram_sangam_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: shram_admin
      POSTGRES_PASSWORD: shram_secret
      POSTGRES_DB: shram_sangam
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shram_admin -d shram_sangam"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: shram_sangam_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  automation-engine:
    build:
      context: ./services/automation-engine
      dockerfile: Dockerfile
    container_name: shram_automation
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://shram_admin:shram_secret@postgres:5432/shram_sangam
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai-scope-service:
    build:
      context: ./services/ai-scope-service
      dockerfile: Dockerfile
    container_name: shram_ai_scope
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data:
